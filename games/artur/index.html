<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Drift 3D</title>
<style>
:root{--bg:#05060f;--fg:#e8f0ff;--ac:#38f5ff;--ac2:#ff3df2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;letter-spacing:.06em;text-shadow:0 0 12px var(--ac);pointer-events:none;z-index:2}
#hud b{color:var(--ac)}#hud .r{text-align:right}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#0a0c2299,#05060fee);z-index:3;padding:16px;overflow:auto;text-align:center}
h1{margin:0;font-size:clamp(34px,8vw,72px);letter-spacing:.12em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #38f5ff66)}
#res{min-height:22px;color:var(--ac2);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(720px,100%)}
button{font:inherit;color:var(--fg);background:#0e1230cc;border:1px solid #38f5ff66;border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--ac);box-shadow:0 0 22px #38f5ff55;transform:translateY(-2px)}
button strong{display:block;font-size:18px;color:var(--ac)}button span{font-size:13px;opacity:.75}
small{opacity:.65;max-width:560px;line-height:1.5}
#back{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:14px;z-index:2;padding:8px 14px;display:none}
</style></head><body>
<div id="hud"><div>SCORE <b id="sc">0</b> &nbsp; <span id="cb"></span></div><div class="r"><span id="lv"></span> <b id="tm"></b></div></div>
<button id="back">Menu</button>
<div id="menu"><h1>NEON DRIFT</h1><div id="res"></div>
<div class="g" id="modes"></div>
<small>Move with mouse, touch or WASD/arrows. Hold click, touch or Space to fire. Smash asteroids, fly through rings to build a combo. Esc returns to the menu.</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const M={arcade:{n:'Arcade',d:'3 lives, speed keeps rising',lives:3,hz:1,sp:1,time:0},
time:{n:'Time Attack',d:'60 seconds, chase the top score',lives:99,hz:1.2,sp:1.1,time:60},
zen:{n:'Zen Flight',d:'No hazards, just rings and colour',lives:0,hz:0,sp:.8,time:0},
hard:{n:'Hardcore',d:'One life, relentless speed',lives:1,hz:1.8,sp:1.35,time:0}};
const $=i=>document.getElementById(i);
const best=k=>{try{return +localStorage.getItem('nd_'+k)||0}catch(e){return 0}};
const setBest=(k,v)=>{try{localStorage.setItem('nd_'+k,v)}catch(e){}};
function drawMenu(){$('modes').innerHTML=Object.keys(M).map(k=>`<button data-m="${k}"><strong>${M[k].n}</strong><span>${M[k].d}</span><br><span>Best: ${best(k)}</span></button>`).join('');
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m))}
if(typeof THREE==='undefined'){$('res').textContent='Could not load Three.js. Check your connection and reload.'}
else{
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.fog=new THREE.FogExp2(0x05060f,.012);
const C=new THREE.PerspectiveCamera(70,1,.1,400);C.position.set(0,1.5,9);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
S.add(new THREE.AmbientLight(0x7080ff,.7));const L=new THREE.PointLight(0xffffff,1.3,70);L.position.set(0,5,8);S.add(L);
// stars
const N=1500,sp=new Float32Array(N*3);for(let i=0;i<N;i++){sp.set([(Math.random()-.5)*160,(Math.random()-.5)*90,-Math.random()*300+20],i*3)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.45,transparent:true,opacity:.85}));S.add(stars);
// tunnel rings + grid
const TM=new THREE.MeshBasicMaterial({color:0x38f5ff}),TG=new THREE.TorusGeometry(13,.07,6,48),T=[];
for(let i=0;i<24;i++){const m=new THREE.Mesh(TG,TM);m.position.z=-i*11;S.add(m);T.push(m)}
const grid=new THREE.GridHelper(240,48,0x38f5ff,0xff3df2);grid.position.y=-8;grid.material.transparent=true;grid.material.opacity=.35;S.add(grid);
// ship
const ship=new THREE.Group(),sm=new THREE.MeshStandardMaterial({color:0xdfe8ff,emissive:0x2040ff,emissiveIntensity:.5,flatShading:true});
const body=new THREE.Mesh(new THREE.ConeGeometry(.5,2.4,6),sm);body.rotation.x=-Math.PI/2;
const wing=new THREE.Mesh(new THREE.BoxGeometry(3.2,.08,.9),sm);wing.position.z=.5;
const eng=new THREE.Mesh(new THREE.SphereGeometry(.28,10,10),new THREE.MeshBasicMaterial({color:0xff3df2}));eng.position.z=1.3;
ship.add(body,wing,eng);S.add(ship);
// pools
const AG=new THREE.IcosahedronGeometry(1,0),AE=new THREE.EdgesGeometry(AG),AL=new THREE.LineBasicMaterial({color:0xff8aa0}),
AM=new THREE.MeshStandardMaterial({color:0x5a1030,emissive:0xff2050,emissiveIntensity:.35,flatShading:true}),
OG=new THREE.TorusGeometry(.9,.16,8,22),OM=new THREE.MeshBasicMaterial({color:0xffe14a}),
BG=new THREE.BoxGeometry(.14,.14,1.4),BM=new THREE.MeshBasicMaterial({color:0x7dffb0}),PG=new THREE.SphereGeometry(.13,4,4);
let st='menu',m,score,lives,tl,t,combo,inv,cd,sa,so,shake,hue=.55,fire=false,auto=false,key={},tx=0,ty=0,sx=0,sy=0,mk;
const A=[],O=[],B=[],P=[];
function clr(a){a.forEach(o=>S.remove(o.m));a.length=0}
let ac;function snd(f,d=.08,ty='square',v=.04){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function boom(p,col,n=14){for(let i=0;i<n;i++){const q=new THREE.Mesh(PG,new THREE.MeshBasicMaterial({color:col,transparent:true}));q.position.copy(p);S.add(q);P.push({m:q,v:new THREE.Vector3((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.5)*14),l:.8})}}
window.start=function(k){mk=k;m=M[k];score=0;lives=m.lives;tl=m.time;t=0;combo=1;inv=0;cd=0;sa=1;so=1;shake=0;
[A,O,B,P].forEach(clr);ship.position.set(0,0,0);sx=sy=tx=ty=0;st='play';$('menu').style.display='none';$('back').style.display='block';$('res').textContent=''};
function end(msg){st='menu';const b=best(mk);if(score>b)setBest(mk,score);$('res').textContent=msg+' Score '+score+(score>b?' (new best!)':'');drawMenu();$('menu').style.display='flex';$('back').style.display='none'}
$('back').onclick=()=>end('Run ended.');
function hit(a,b,r){return a.position.distanceTo(b.position)<r}
function update(dt){
t+=dt;const spd=(36+Math.min(t*(m.hz?.9:0),40))*m.sp;
hue=(hue+dt*(m.hz?.012:.04))%1;
key.l&&(tx-=dt*1.8);key.r&&(tx+=dt*1.8);key.u&&(ty+=dt*1.8);key.d&&(ty-=dt*1.8);tx=Math.max(-1,Math.min(1,tx));ty=Math.max(-1,Math.min(1,ty));
const px=ship.position.x;sx=tx*9;sy=ty*4.5;
ship.position.x+=(sx-ship.position.x)*Math.min(1,dt*9);ship.position.y+=(sy-ship.position.y)*Math.min(1,dt*9);
ship.rotation.z+=((px-ship.position.x)*5-ship.rotation.z)*Math.min(1,dt*10);ship.rotation.x=(ship.position.y-sy)*.05;
ship.visible=inv<=0||Math.floor(inv*12)%2==0;
cd-=dt;inv-=dt;
if(m.hz&&(fire||auto)&&cd<=0){const b=new THREE.Mesh(BG,BM);b.position.copy(ship.position);b.position.z-=1.5;S.add(b);B.push({m:b});cd=.15;snd(700,.06,'sawtooth',.02)}
sa-=dt;if(m.hz&&sa<=0){const r=.8+Math.random()*1.6,a=new THREE.Mesh(AG,AM);a.add(new THREE.LineSegments(AE,AL));a.scale.setScalar(r);
a.position.set((Math.random()-.5)*20,(Math.random()-.5)*10,-190);S.add(a);A.push({m:a,r,hp:r>1.8?2:1,s:new THREE.Vector3(Math.random(),Math.random(),Math.random()).multiplyScalar(2)});sa=.75/(m.hz*(1+t*.012))}
so-=dt;if(so<=0){const o=new THREE.Mesh(OG,OM);o.position.set((Math.random()-.5)*16,(Math.random()-.5)*8,-190);S.add(o);O.push({m:o});so=m.hz?1.3:.55}
for(let i=A.length-1;i>=0;i--){const a=A[i],p=a.m;p.position.z+=spd*dt;p.rotation.x+=a.s.x*dt;p.rotation.y+=a.s.y*dt;
if(p.position.z>14){S.remove(p);A.splice(i,1);continue}
if(inv<=0&&hit(p,ship,a.r+.9)){boom(p.position,0xff4060,22);S.remove(p);A.splice(i,1);snd(90,.35,'sawtooth',.08);combo=1;shake=.6;
if(m.lives<90){lives--;inv=1.6;if(lives<=0){end('Ship destroyed.');return}}else{score=Math.max(0,score-20);inv=1}continue}}
for(let i=B.length-1;i>=0;i--){const b=B[i];b.m.position.z-=95*dt;let gone=b.m.position.z<-200;
if(!gone)for(let j=A.length-1;j>=0;j--){const a=A[j];if(hit(b.m,a.m,a.r+.5)){gone=true;a.hp--;boom(b.m.position,0xffb0c0,5);
if(a.hp<=0){boom(a.m.position,0xff6a8a,20);S.remove(a.m);A.splice(j,1);score+=10*combo;snd(220,.2,'sawtooth',.05)}break}}
if(gone){S.remove(b.m);B.splice(i,1)}}
for(let i=O.length-1;i>=0;i--){const o=O[i];o.m.position.z+=spd*dt;o.m.rotation.y+=dt*3;o.m.rotation.x+=dt*1.5;
if(hit(o.m,ship,1.9)){boom(o.m.position,0xffe14a,16);S.remove(o.m);O.splice(i,1);combo=Math.min(combo+1,9);score+=25*combo;snd(520+combo*60,.12,'sine',.07);continue}
if(o.m.position.z>14){S.remove(o.m);O.splice(i,1);if(m.hz)combo=1}}
for(let i=P.length-1;i>=0;i--){const q=P[i];q.l-=dt;q.m.position.addScaledVector(q.v,dt);q.m.material.opacity=Math.max(0,q.l);if(q.l<=0){S.remove(q.m);q.m.material.dispose();P.splice(i,1)}}
if(tl>0){tl-=dt;if(tl<=0){end('Time up!');return}}
// world
for(const r of T){r.position.z+=spd*dt;if(r.position.z>12)r.position.z-=264;r.rotation.z+=dt*.2}
const sp=sg.attributes.position.array;for(let i=0;i<N;i++){sp[i*3+2]+=spd*dt*1.1;if(sp[i*3+2]>20)sp[i*3+2]-=300}sg.attributes.position.needsUpdate=true;
grid.position.z=(grid.position.z+spd*dt)%5;
TM.color.setHSL(hue,1,.55);grid.material.color.setHSL((hue+.5)%1,1,.5);S.fog.color.setHSL(hue,.6,.04);R.setClearColor(S.fog.color);
shake=Math.max(0,shake-dt*2);
C.position.x+=(ship.position.x*.45-C.position.x)*Math.min(1,dt*4)+(Math.random()-.5)*shake;
C.position.y+=(1.5+ship.position.y*.4-C.position.y)*Math.min(1,dt*4)+(Math.random()-.5)*shake;
C.lookAt(ship.position.x*.3,ship.position.y*.3,-20);
$('sc').textContent=score;$('cb').textContent=combo>1?'x'+combo:'';
$('lv').textContent=m.lives&&m.lives<90?'\u2665'.repeat(Math.max(0,lives)):'';$('tm').textContent=m.time?Math.ceil(tl)+'s':'';}
let last=performance.now();
(function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;
if(st==='play')update(dt);else{hue=(hue+dt*.03)%1;TM.color.setHSL(hue,1,.55);R.setClearColor(0x05060f);for(const r of T){r.position.z+=14*dt;if(r.position.z>12)r.position.z-=264}ship.rotation.z=Math.sin(n/700)*.3;C.position.set(0,1.5,9);C.lookAt(0,0,-20)}
R.render(S,C)})(last);
const mv=e=>{tx=(e.clientX/innerWidth-.5)*2;ty=-(e.clientY/innerHeight-.5)*2};
addEventListener('pointermove',e=>{if(st==='play')mv(e)});
addEventListener('pointerdown',e=>{if(st!=='play')return;mv(e);fire=true;if(e.pointerType==='touch')auto=true});
addEventListener('pointerup',()=>{fire=false});
const K={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{if(K[e.code])key[K[e.code]]=1;if(e.code==='Space'){fire=true;e.preventDefault()}if(e.code==='Escape'&&st==='play')end('Run ended.')});
addEventListener('keyup',e=>{if(K[e.code])key[K[e.code]]=0;if(e.code==='Space')fire=false});
}
drawMenu();
</script></body></html>
